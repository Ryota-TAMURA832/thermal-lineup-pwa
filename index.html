<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes" />
    <title>ThermalLineupPwa</title>
    <base href="/thermal-lineup-pwa/" />

    <link rel="stylesheet" href="css/bootstrap/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="ThermalLineupPwa.styles.css" rel="stylesheet" />

    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        エラーが発生しました。
        <a href="" class="reload">再読み込み</a>
        <a class="dismiss">🗙</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>

    <script>
        if ("serviceWorker" in navigator) {
            navigator.serviceWorker.register("service-worker.js");
        }
    </script>

    <script src="js/jspdf.umd.min.js"></script>

    <script>
        function pick(obj, pascalName, camelName, fallback) {
            if (!obj) return fallback;
            if (obj[camelName] !== undefined && obj[camelName] !== null) return obj[camelName];
            if (obj[pascalName] !== undefined && obj[pascalName] !== null) return obj[pascalName];
            return fallback;
        }

        function mm(mmValue, dpi) {
            return Math.round(mmValue / 25.4 * dpi);
        }

        function fitText(ctx, text, fontFamily, maxPx, fontSizePx, weight, minPx) {
            const s = String(text ?? "");
            let size = fontSizePx;

            while (size > minPx) {
                ctx.font = `${weight} ${size}px ${fontFamily}`;
                if (ctx.measureText(s).width <= maxPx) {
                    return size;
                }
                size -= 1;
            }

            return minPx;
        }

        function drawCenteredText(ctx, text, x, y, w, h, fontFamily, fontSizePx, weight = "700", maxWidthRatio = 0.92) {
            const s = String(text ?? "");
            if (!s) return;

            const maxWidth = w * maxWidthRatio;
            const finalSize = fitText(ctx, s, fontFamily, maxWidth, fontSizePx, weight, Math.max(10, Math.floor(fontSizePx * 0.65)));

            ctx.save();
            ctx.font = `${weight} ${finalSize}px ${fontFamily}`;
            ctx.fillStyle = "#000";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(s, x + w / 2, y + h / 2);
            ctx.restore();
        }

        function drawTopLeftLabel(ctx, text, x, y, fontFamily, fontSizePx) {
            ctx.save();
            ctx.font = `400 ${fontSizePx}px ${fontFamily}`;
            ctx.fillStyle = "#000";
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillText(String(text ?? ""), x, y);
            ctx.restore();
        }

        function drawRect(ctx, x, y, w, h, linePx) {
            ctx.strokeStyle = "#000";
            ctx.lineWidth = linePx;
            ctx.strokeRect(x, y, w, h);
        }

        function drawLine(ctx, x1, y1, x2, y2, linePx) {
            ctx.beginPath();
            ctx.strokeStyle = "#000";
            ctx.lineWidth = linePx;
            ctx.moveTo(x1, y1);
            ctx.lineTo(x2, y2);
            ctx.stroke();
        }

        function drawPlayerName(ctx, player, x, y, w, h, fontFamily, kanaPx, namePx) {
            if (!player) return;

            const kana = pick(player, "Kana", "kana", "");
            const name = pick(player, "Name", "name", "");

            ctx.save();
            ctx.fillStyle = "#000";
            ctx.textAlign = "center";

            if (kana) {
                const kanaSize = fitText(ctx, kana, fontFamily, w * 0.92, kanaPx, "400", Math.max(8, Math.floor(kanaPx * 0.7)));
                ctx.font = `400 ${kanaSize}px ${fontFamily}`;
                ctx.textBaseline = "middle";
                ctx.fillText(kana, x + w / 2, y + h * 0.28);
            }

            if (name) {
                const nameSize = fitText(ctx, name, fontFamily, w * 0.92, namePx, "700", Math.max(12, Math.floor(namePx * 0.72)));
                ctx.font = `700 ${nameSize}px ${fontFamily}`;
                ctx.textBaseline = "middle";
                ctx.fillText(name, x + w / 2, y + h * 0.66);
            }

            ctx.restore();
        }

        function getPlayerByKey(roster, key) {
            if (!key) return null;

            for (const p of roster) {
                const no = pick(p, "No", "no", "");
                const name = pick(p, "Name", "name", "");
                const k = `${no}\t${name}`;
                if (k === key) return p;
            }

            return null;
        }

        function normalizeState(state) {
            const roster = pick(state, "Roster", "roster", []) || [];
            const regularRows = pick(state, "RegularRows", "regularRows", []) || [];
            const benchRows = pick(state, "BenchRows", "benchRows", []) || [];

            return {
                teamName: pick(state, "TeamName", "teamName", ""),
                coachName: pick(state, "CoachName", "coachName", ""),
                captainName: pick(state, "CaptainName", "captainName", ""),
                selectedTournament: pick(state, "SelectedTournament", "selectedTournament", ""),
                roster,
                regularRows,
                benchRows
            };
        }

        window.drawMemberSheetCanvas = function (rawState) {
            const state = normalizeState(rawState);

            const canvas = document.getElementById("member-sheet-canvas");
            if (!canvas) {
                alert("Canvasが見つかりません。");
                return null;
            }

            const dpi = 300;
            const pageWidthMm = 80;
            const marginMm = 2.5;
            const linePx = 2;

            const pageW = mm(pageWidthMm, dpi);
            const margin = mm(marginMm, dpi);
            const contentW = pageW - margin * 2;

            const titleH = mm(8, dpi);
            const titleGap = mm(1.3, dpi);
            const headerH = mm(22, dpi);
            const headerGap = mm(2, dpi);
            const regularHeadH = mm(5.5, dpi);
            const regularRowH = mm(8.4, dpi);
            const regularGap = mm(3, dpi);
            const benchHeadH = mm(5.5, dpi);
            const benchRowH = mm(9, dpi);
            const bottomMargin = mm(3, dpi);

            const regularH = regularHeadH + regularRowH * 10;
            const benchH = benchHeadH + benchRowH * 5;

            const pageH =
                margin +
                titleH +
                titleGap +
                headerH +
                headerGap +
                regularH +
                regularGap +
                benchH +
                bottomMargin;

            canvas.width = pageW;
            canvas.height = pageH;

            canvas.style.width = "80mm";
            canvas.style.height = `${pageH / dpi * 25.4}mm`;

            const ctx = canvas.getContext("2d");

            ctx.fillStyle = "#fff";
            ctx.fillRect(0, 0, pageW, pageH);

            ctx.strokeStyle = "#000";
            ctx.fillStyle = "#000";

            const fontFamily = `"Yu Gothic", "Yu Gothic UI", "Meiryo", sans-serif`;

            let y = margin;

            drawCenteredText(ctx, "メンバー表", margin, y, contentW, titleH, fontFamily, 54, "700");
            y += titleH + titleGap;

            const headerX = margin;
            const headerY = y;
            const headerCellW = contentW / 2;
            const headerCellH = headerH / 2;

            const headerCells = [
                { label: "チーム名", value: state.teamName, x: headerX, y: headerY },
                { label: "監督", value: state.coachName, x: headerX + headerCellW, y: headerY },
                { label: "大会名", value: state.selectedTournament, x: headerX, y: headerY + headerCellH },
                { label: "主将", value: state.captainName, x: headerX + headerCellW, y: headerY + headerCellH }
            ];

            for (const c of headerCells) {
                drawRect(ctx, c.x, c.y, headerCellW, headerCellH, linePx);
                drawTopLeftLabel(ctx, c.label, c.x + mm(1, dpi), c.y + mm(0.7, dpi), fontFamily, 22);
                drawCenteredText(ctx, c.value, c.x, c.y + mm(1.2, dpi), headerCellW, headerCellH - mm(1.2, dpi), fontFamily, 42, "700");
            }

            y += headerH + headerGap;

            const regularX = margin;
            const regularY = y;

            const cOrder = mm(7, dpi);
            const cPos = mm(9, dpi);
            const cNo = mm(11, dpi);
            const cName = contentW - cOrder - cPos - cNo;

            const xOrder = regularX;
            const xPos = xOrder + cOrder;
            const xName = xPos + cPos;
            const xNo = xName + cName;

            drawRect(ctx, regularX, regularY, contentW, regularH, linePx);
            drawLine(ctx, xPos, regularY, xPos, regularY + regularH, linePx);
            drawLine(ctx, xName, regularY, xName, regularY + regularH, linePx);
            drawLine(ctx, xNo, regularY, xNo, regularY + regularH, linePx);
            drawLine(ctx, regularX, regularY + regularHeadH, regularX + contentW, regularY + regularHeadH, linePx);

            drawCenteredText(ctx, "打順", xOrder, regularY, cOrder, regularHeadH, fontFamily, 26, "600");
            drawCenteredText(ctx, "守備", xPos, regularY, cPos, regularHeadH, fontFamily, 26, "600");
            drawCenteredText(ctx, "選手名", xName, regularY, cName, regularHeadH, fontFamily, 26, "600");
            drawCenteredText(ctx, "背番号", xNo, regularY, cNo, regularHeadH, fontFamily, 25, "600");

            for (let i = 0; i < 10; i++) {
                const row = state.regularRows[i] || {};
                const rowY = regularY + regularHeadH + regularRowH * i;

                drawLine(ctx, regularX, rowY + regularRowH, regularX + contentW, rowY + regularRowH, linePx);

                const order = pick(row, "Order", "order", "");
                const pos = pick(row, "Position", "position", "");
                const key = pick(row, "PlayerKey", "playerKey", "");
                const p = getPlayerByKey(state.roster, key);

                drawCenteredText(ctx, order, xOrder, rowY, cOrder, regularRowH, fontFamily, 44, "700");
                drawCenteredText(ctx, pos, xPos, rowY, cPos, regularRowH, fontFamily, 44, "700");
                drawPlayerName(ctx, p, xName, rowY, cName, regularRowH, fontFamily, 22, 44);

                if (p) {
                    const no = pick(p, "No", "no", "");
                    drawCenteredText(ctx, no, xNo, rowY, cNo, regularRowH, fontFamily, 44, "700");
                }
            }

            y += regularH + regularGap;

            const benchX = margin;
            const benchY = y;

            const halfW = contentW / 2;
            const benchNoW = cNo;
            const benchNameW = halfW - benchNoW;

            const bxLName = benchX;
            const bxLNo = bxLName + benchNameW;
            const bxRName = benchX + halfW;
            const bxRNo = bxRName + benchNameW;

            drawRect(ctx, benchX, benchY, contentW, benchH, linePx);
            drawLine(ctx, benchX + halfW, benchY, benchX + halfW, benchY + benchH, linePx);
            drawLine(ctx, bxLNo, benchY, bxLNo, benchY + benchH, linePx);
            drawLine(ctx, bxRNo, benchY, bxRNo, benchY + benchH, linePx);
            drawLine(ctx, benchX, benchY + benchHeadH, benchX + contentW, benchY + benchHeadH, linePx);

            drawCenteredText(ctx, "控え 選手名", bxLName, benchY, benchNameW, benchHeadH, fontFamily, 26, "600");
            drawCenteredText(ctx, "背番号", bxLNo, benchY, benchNoW, benchHeadH, fontFamily, 25, "600");
            drawCenteredText(ctx, "控え 選手名", bxRName, benchY, benchNameW, benchHeadH, fontFamily, 26, "600");
            drawCenteredText(ctx, "背番号", bxRNo, benchY, benchNoW, benchHeadH, fontFamily, 25, "600");

            for (let i = 0; i < 5; i++) {
                const rowY = benchY + benchHeadH + benchRowH * i;

                drawLine(ctx, benchX, rowY + benchRowH, benchX + contentW, rowY + benchRowH, linePx);

                const left = state.benchRows[i] || {};
                const right = state.benchRows[i + 5] || {};

                const leftKey = pick(left, "PlayerKey", "playerKey", "");
                const rightKey = pick(right, "PlayerKey", "playerKey", "");

                const leftPlayer = getPlayerByKey(state.roster, leftKey);
                const rightPlayer = getPlayerByKey(state.roster, rightKey);

                drawPlayerName(ctx, leftPlayer, bxLName, rowY, benchNameW, benchRowH, fontFamily, 22, 38);
                drawPlayerName(ctx, rightPlayer, bxRName, rowY, benchNameW, benchRowH, fontFamily, 22, 38);

                if (leftPlayer) {
                    drawCenteredText(ctx, pick(leftPlayer, "No", "no", ""), bxLNo, rowY, benchNoW, benchRowH, fontFamily, 42, "700");
                }

                if (rightPlayer) {
                    drawCenteredText(ctx, pick(rightPlayer, "No", "no", ""), bxRNo, rowY, benchNoW, benchRowH, fontFamily, 42, "700");
                }
            }

            return {
                width: pageW,
                height: pageH,
                widthMm: pageWidthMm,
                heightMm: pageH / dpi * 25.4
            };
        };

        window.createMemberSheetPdfFromCanvas = async function (rawState) {
            const area = document.getElementById("pdf-link-area");
            const status = document.getElementById("pdf-status");
            const link = document.getElementById("pdf-open-link");

            if (area) area.style.display = "block";
            if (status) status.textContent = "PDF生成中...";
            if (link) {
                link.removeAttribute("href");
                link.removeAttribute("download");
            }

            try {
                if (!window.jspdf) {
                    if (status) status.textContent = "PDF生成失敗: jsPDFを読み込めませんでした。";
                    alert("PDF作成ライブラリを読み込めませんでした。js/jspdf.umd.min.js が存在するか確認してください。");
                    return;
                }

                const info = window.drawMemberSheetCanvas(rawState);
                if (!info) {
                    if (status) status.textContent = "PDF生成失敗: Canvas作成に失敗しました。";
                    return;
                }

                const canvas = document.getElementById("member-sheet-canvas");
                const imgData = canvas.toDataURL("image/png");

                const { jsPDF } = window.jspdf;

                const pdf = new jsPDF({
                    orientation: "portrait",
                    unit: "mm",
                    format: [info.widthMm, info.heightMm]
                });

                pdf.addImage(imgData, "PNG", 0, 0, info.widthMm, info.heightMm);

                const blob = pdf.output("blob");
                const fileName = "membersheet_80mm.pdf";

                if (window.memberSheetPdfUrl) {
                    URL.revokeObjectURL(window.memberSheetPdfUrl);
                }

                const url = URL.createObjectURL(blob);
                window.memberSheetPdfUrl = url;

                if (link) {
                    link.href = url;
                    link.download = fileName;
                    link.target = "_blank";
                    link.rel = "noopener";
                }

                if (status) {
                    status.textContent = `PDF生成成功: ${blob.size.toLocaleString()} bytes`;
                }
            } catch (e) {
                console.error(e);
                if (status) {
                    status.textContent = "PDF生成失敗: " + (e && e.message ? e.message : String(e));
                }
                alert("PDF生成に失敗しました: " + (e && e.message ? e.message : String(e)));
            }
        };
    </script>
</body>

</html>
